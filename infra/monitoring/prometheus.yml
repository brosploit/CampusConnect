# Prometheus Monitoring Configuration for Campus Connect
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # 1. Node.js Backend API Metrics
  - job_name: 'campusconnect_backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend-api:4000']

  # 2. PostgreSQL Database Engine Metrics
  - job_name: 'campusconnect_postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # 3. Nginx Gateway & Ingress Metrics
  - job_name: 'campusconnect_nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
