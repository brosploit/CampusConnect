# Campus Connect Web Dashboard — Production Nginx Configuration
# Defense-in-depth HTTP security headers & SPA fallback routing

server {
    listen 80;
    server_name dashboard.campusconnect.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dashboard.campusconnect.edu;

    ssl_certificate /etc/ssl/certs/campusconnect.crt;
    ssl_certificate_key /etc/ssl/private/campusconnect.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Content Security Policy (Level 3)
    # Strictly disallows unsafe-eval, unsafe-inline scripts, and restricts connect-src to backend API
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' https://api.campusconnect.edu; font-src 'self'; object-src 'none'; media-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # 2. Strict Transport Security (HSTS - 2 years + preload)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 3. Clickjacking Prevention
    add_header X-Frame-Options "DENY" always;

    # 4. MIME-Sniffing Prevention
    add_header X-Content-Type-Options "nosniff" always;

    # 5. Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 6. Permissions Policy (Disables microphone, camera, geolocation, payments)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    # 7. Disable Server Version Fingerprinting
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # SPA Client-Side Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static Assets Caching (Fingerprinted assets)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API Proxy with Secure Cookie Forwarding
    location /api/ {
        proxy_pass https://api.campusconnect.edu/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Strict";
    }
}
