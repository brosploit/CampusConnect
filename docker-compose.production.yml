# Campus Connect Production Topology & Defense-in-Depth Hardening
# Strict Network Isolation: Database is completely isolated and never exposed to the public internet.

version: '3.8'

networks:
  public_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: false
  database_net:
    driver: bridge
    internal: true # Air-gapped network: zero ingress/egress from outside

volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local

services:
  # 1. Reverse Proxy / Ingress Gateway (HTTPS, CSP, TLS Termination)
  reverse-proxy:
    image: nginx:alpine
    container_name: cc_production_gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/certs/campusconnect:/etc/ssl/certs:ro
      - /etc/ssl/private/campusconnect:/etc/ssl/private:ro
    networks:
      - public_net
      - backend_net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - web-dashboard
      - backend-api

  # 2. Web Frontend Dashboard
  web-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cc_production_web
    restart: always
    networks:
      - backend_net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 3. Backend API Application Server
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cc_production_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api/v1
      # Secrets injected at runtime from cloud vault (AWS Secrets Manager / Vault)
      DATABASE_URL: postgresql://cc_api_user:${DB_PASSWORD}@postgres-db:5432/campus_connect?sslmode=disable
      DATABASE_MIGRATION_URL: postgresql://cc_migration_user:${DB_MIGRATION_PASSWORD}@postgres-db:5432/campus_connect?sslmode=disable
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      CORS_ALLOWED_ORIGINS: "https://dashboard.campusconnect.edu"
    networks:
      - backend_net
      - database_net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    depends_on:
      postgres-db:
        condition: service_healthy

  # 4. PostgreSQL Isolated Database Engine (Zero public port mapping)
  postgres-db:
    image: postgres:16-alpine
    container_name: cc_production_db
    restart: always
    environment:
      POSTGRES_DB: campus_connect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - database_net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_connect"]
      interval: 10s
      timeout: 5s
      retries: 5
